services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: mdsearch
      POSTGRES_PASSWORD: mdsearch
      POSTGRES_DB: mdsearch
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdsearch"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
